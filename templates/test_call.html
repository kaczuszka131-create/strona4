<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Test połączenia — {{ client_id }}</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f1115; color: #e8e8e8;
               display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .box { background: #1a1d24; padding: 32px; border-radius: 12px; width: 420px;
               box-shadow: 0 10px 40px rgba(0,0,0,.5); }
        h1 { margin-top: 0; font-size: 20px; }
        label { display: block; margin-top: 14px; font-size: 13px; opacity: .8; }
        input, select { width: 100%; padding: 8px 10px; margin-top: 4px; background: #0f1115;
                        border: 1px solid #2c303a; border-radius: 6px; color: #e8e8e8; }
        button { margin-top: 20px; width: 100%; padding: 10px; background: #4f8ef7;
                 border: 0; border-radius: 6px; color: white; font-weight: 600; cursor: pointer; }
        button:hover { background: #3b7ae0; }
        .info { font-size: 12px; opacity: .6; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>📞 Test dynamicznego połączenia</h1>
        <div class="info">Client ID: <code>{{ client_id }}</code></div>

        <label>Imię / Nazwa</label>
        <input id="name" value="Test Testowy">

        <label>URL obrazka (opcjonalnie)</label>
        <input id="image_url" placeholder="https://...">

        <label>Kolor tła</label>
        <select id="bg_color">
            <option value="black">Czarny</option>
            <option value="darkblue">Granatowy</option>
            <option value="darkred">Ciemnoczerwony</option>
            <option value="darkgreen">Ciemnozielony</option>
        </select>

        <button onclick="send()">Wyślij połączenie</button>
    </div>

    <script>
        async function send() {
            const res = await fetch('/api/send_dynamic_call', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    client_id: "{{ client_id }}",
                    name: document.getElementById('name').value,
                    image_url: document.getElementById('image_url').value || null,
                    bg_color: document.getElementById('bg_color').value
                })
            });
            const data = await res.json();
            alert(data.success ? '✅ Wysłano!' : '❌ Błąd: ' + data.error);
        }
    </script>
</body>
</html>
